name: Generate Recipe A4

on:
  repository_dispatch:
    types: [generate_recipe]
  workflow_dispatch:
    inputs:
      recipe_url:
        description: 'Link do przepisu kulinarnego (gdy uruchamiasz ręcznie)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Obsługuje dane zarówno z panelu admina (dispatch), jak i z ręcznego uruchomienia na GitHubie
          INPUT_TYPE: ${{ github.event.client_payload.input_type || 'url' }}
          RECIPE_INPUT: ${{ github.event.client_payload.recipe_input || github.event.inputs.recipe_url }}
        run: python scripts/generate_recipe.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add przepisy/ recipes.json
          git status
          git diff-index --quiet HEAD || git commit -m "Automatycznie dodano nowy przepis"
          git push
