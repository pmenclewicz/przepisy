name: Update All Recipes Except Pancakes

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update script for all other recipes
        run: |
          python - << 'EOF'
          import os
          import glob

          wake_lock_script = """
          <script>
            async function preventScreenSleep() {
                if ('wakeLock' in navigator) {
                    try {
                        let wakeLock = await navigator.wakeLock.request('screen');
                        document.addEventListener('visibilitychange', async () => {
                            if (wakeLock !== null && document.visibilityState === 'visible') {
                                wakeLock = await navigator.wakeLock.request('screen');
                            }
                        });
                    } catch (err) {
                        console.log(`Błąd Wake Lock: ${err.name}, ${err.message}`);
                    }
                }
            }
            preventScreenSleep();
          </script>
          """

          recipes_dir = "przepisy"
          excluded_file = "pancakes-sniadaniowe.html"
          count = 0

          if os.path.exists(recipes_dir):
              for file_path in glob.glob(os.path.join(recipes_dir, "*.html")):
                  # Sprawdź czy to nie jest nasz pominięty plik
                  if os.path.basename(file_path) == excluded_file:
                      print(f"Pominięto (wykluczony plik): {file_path}")
                      continue

                  with open(file_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  if "wakeLock" in content:
                      print(f"Plik ma już Wake Lock: {file_path}")
                      continue

                  if "</body>" in content:
                      new_content = content.replace("</body>", f"{wake_lock_script}\n</body>")
                      with open(file_path, "w", encoding="utf-8") as f:
                          f.write(new_content)
                      print(f"Zaktualizowano: {file_path}")
                      count += 1
                  else:
                      print(f"Brak znacznika </body> w pliku: {file_path}")
              
              print(f"\nŁącznie zaktualizowano nowych plików: {count}")
          EOF

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add przepisy/
          git diff --staged --quiet || git commit -m "Masowa aktualizacja: dodanie blokady ekranu do pozostałych przepisów"
          git push
