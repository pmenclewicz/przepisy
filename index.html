<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Biblioteka Przepisów</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: #faf6f0;
            color: #2c2c2c;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8b5e3c;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: #5c3a21;
            font-size: 28px;
            font-weight: normal;
        }

        .admin-btn {
            background-color: #8b5e3c;
            color: #ffffff;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .admin-btn:hover {
            background-color: #704a2e;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            background: #ffffff;
            border: 1px solid #e2d7cd;
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .recipe-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .recipe-date {
            font-size: 12px;
            color: #888888;
            font-family: system-ui, -apple-system, sans-serif;
            margin-bottom: 8px;
        }

        .recipe-title {
            font-size: 18px;
            color: #2c2c2c;
            margin: 0 0 18px 0;
            line-height: 1.35;
        }

        .view-btn {
            display: inline-block;
            text-align: center;
            background-color: #f4ede4;
            color: #8b5e3c;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 5px;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 600;
            font-size: 13px;
            transition: background-color 0.2s ease;
        }

        .view-btn:hover {
            background-color: #ebdcd0;
        }

        .empty-info {
            text-align: center;
            color: #666666;
            grid-column: 1 / -1;
            padding: 50px 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #ffffff;
            border-radius: 8px;
            border: 1px dashed #d0c2b4;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Moja Biblioteka Przepisów</h1>
        <a href="admin.html" class="admin-btn">+ Dodaj przepis</a>
    </header>

    <div class="recipes-grid" id="recipesList">
        <div class="empty-info">Wczytywanie przepisów...</div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const listEl = document.getElementById("recipesList");

    try {
        // Pobierz aktualną bazę danych recipes.json (z ominięciem pamięci podręcznej)
        const response = await fetch("./recipes.json?t=" + new Date().getTime());
        if (!response.ok) throw new Error("Brak pliku bazy danych.");

        const recipes = await response.json();

        if (!recipes || recipes.length === 0) {
            listEl.innerHTML = `
                <div class="empty-info">
                    <p style="margin: 0 0 10px 0; font-size: 16px;">Brak zapisanych przepisów.</p>
                    <a href="admin.html" style="color: #8b5e3c; font-weight: bold;">Kliknij tutaj, aby dodać pierwszy przepis!</a>
                </div>`;
            return;
        }

        listEl.innerHTML = recipes.map(r => `
            <div class="recipe-card">
                <div>
                    <div class="recipe-date">${r.date || ''}</div>
                    <h2 class="recipe-title">${r.title}</h2>
                </div>
                <a href="${r.file}" class="view-btn" target="_blank">Otwórz przepis (A4 / PDF) →</a>
            </div>
        `).join('');

    } catch (err) {
        listEl.innerHTML = `
            <div class="empty-info">
                Nie znaleziono jeszcze pliku <code>recipes.json</code>.<br>
                Przejdź do panelu <a href="admin.html" style="color: #8b5e3c; font-weight: bold;">Admina</a> i dodaj swój pierwszy przepis.
            </div>`;
    }
});
</script>

</body>
</html>
