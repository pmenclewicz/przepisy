<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masa czekoladowa do andrutu</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 10mm;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: none;
        padding: 0;
      }
      .recipe-card {
        border: none;
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: #fbf9f5;
      color: #2c2523;
      margin: 0;
      padding: 20px 10px;
      line-height: 1.6;
    }

    .recipe-card {
      max-width: 750px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #dcd3c9;
      border-radius: 4px;
      padding: 35px 40px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      border-bottom: 2px solid #8b5e3c;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 26px;
      color: #4a2c11;
      margin: 0 0 10px 0;
      font-weight: normal;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .ornament {
      color: #8b5e3c;
      font-size: 18px;
      line-height: 1;
    }

    .section-title {
      font-size: 18px;
      color: #8b5e3c;
      border-bottom: 1px solid #e8dfd8;
      padding-bottom: 5px;
      margin-top: 25px;
      margin-bottom: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    ul {
      list-style-type: square;
      padding-left: 20px;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    li {
      margin-bottom: 8px;
      font-size: 16px;
    }

    .instructions {
      font-size: 16px;
      margin-top: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px 5px;
      }
      .recipe-card {
        padding: 20px 15px;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="no-print" style="position: fixed; top: 10px; right: 10px; background: #fff; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 9999;">
    <button onclick="window.print()" style="background: #8b5e3c; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">🖨️ Drukuj / Zapisz PDF</button>
    <a href="../index.html" style="margin-left: 10px; color: #8b5e3c; text-decoration: none; font-weight: bold;">← Powrót</a>
  </div>

  <div class="recipe-card">
    <div class="header">
      <h1>Masa czekoladowa do andrutu</h1>
      <div class="ornament">❦</div>
    </div>

    <div class="section-title">Składniki</div>
    <ul>
      <li>1 kostka margaryny</li>
      <li>1 szklanka cukru</li>
      <li>1/3 szklanki wody</li>
      <li>2 łyżki ciemnego kakao</li>
      <li>1,5 - 2 szklanek mleka w proszku, tłustego</li>
    </ul>

    <div class="section-title">Sposób przygotowania</div>
    <p class="instructions">Wszystko zagotować</p>
  </div>

</body>
</html>
