<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crème brûlée</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  @media print { .no-print { display: none; } }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f4efe6;
    color: #2b2118;
    font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 100%;
    margin: 0 auto;
    padding: 16px 14px 24px;
  }

  .book {
    max-width: 100%;
    background: #fffdf8;
    border: 2px solid #8b5e3c;
    outline: 1px solid #c9a878;
    outline-offset: 4px;
    padding: 22px 20px 26px;
    border-radius: 3px;
  }

  .kicker {
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #8b5e3c;
    margin: 0 0 6px;
  }

  h1 {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 1.9rem;
    line-height: 1.1;
    text-align: center;
    margin: 0 0 4px;
    color: #3a2a1c;
    font-weight: 700;
  }

  .subtitle {
    text-align: center;
    font-style: italic;
    font-size: 0.95rem;
    color: #6b5644;
    margin: 0 0 14px;
  }

  .rule {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
  }
  .rule::before,
  .rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a878, transparent);
  }
  .rule span {
    color: #b08a5e;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 18px;
    font-size: 0.82rem;
    color: #5a4636;
    margin: 0 0 4px;
  }
  .meta b { color: #8b5e3c; font-weight: 700; }

  h2 {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #8b5e3c;
    border-bottom: 1px solid #d8c3a3;
    padding-bottom: 4px;
    margin: 20px 0 10px;
  }

  .ingredients {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .ingredients li {
    position: relative;
    padding: 3px 0 3px 20px;
    font-size: 0.95rem;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .ingredients li::before {
    content: "•";
    position: absolute;
    left: 4px;
    color: #b08a5e;
  }
  .ingredients li .amt {
    font-weight: 700;
    color: #3a2a1c;
    white-space: normal;
  }

  .steps {
    counter-reset: step;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .steps li {
    counter-increment: step;
    position: relative;
    padding: 6px 0 6px 34px;
    font-size: 0.95rem;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #8b5e3c;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .note {
    margin-top: 18px;
    padding: 10px 14px;
    background: #f7f0e4;
    border-left: 3px solid #b08a5e;
    font-size: 0.85rem;
    font-style: italic;
    color: #5a4636;
    overflow-wrap: break-word;
  }
  .note b { font-style: normal; color: #8b5e3c; }

  .footer {
    text-align: center;
    font-size: 0.72rem;
    color: #9a8468;
    margin-top: 18px;
    letter-spacing: 0.05em;
  }

  @media (max-width: 480px) {
    .book { padding: 16px 12px 20px; }
    h1 { font-size: 1.55rem; }
    .ingredients li, .steps li { font-size: 0.9rem; }
  }
</style>
</head>
<body>
  <div class="no-print" style="position: fixed; top: 10px; right: 10px; background: #fff; padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 9999;">
    <button onclick="window.print()" style="background: #8b5e3c; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">🖨️ Drukuj / Zapisz PDF</button>
    <a href="../index.html" style="margin-left: 10px; color: #8b5e3c; text-decoration: none; font-weight: bold;">← Powrót</a>
  </div>

  <div class="page">
    <div class="book">
      <p class="kicker">Kuchnia francuska</p>
      <h1>Crème brûlée</h1>
      <p class="subtitle">Krem z karmelizowaną skórką</p>

      <div class="rule"><span>❦</span></div>

      <div class="meta">
        <span><b>Porcje:</b> 4</span>
        <span><b>Czas przygotowania:</b> 30 min</span>
        <span><b>Czas pieczenia:</b> 45 min</span>
      </div>

      <h2>Składniki</h2>
      <ul class="ingredients">
        <li><span class="amt">500 ml</span> śmietanki 30%</li>
        <li><span class="amt">100 ml</span> mleka</li>
        <li><span class="amt">5</span> żółtek</li>
        <li><span class="amt">100 g</span>
